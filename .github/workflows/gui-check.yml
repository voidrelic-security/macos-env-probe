name: gui-check
on:
  workflow_dispatch:

jobs:
  chk:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: probe GUI session
        run: |
          set +e
          echo "=== WindowServer / loginwindow ==="
          pgrep -lf WindowServer
          pgrep -lf loginwindow
          echo "=== gui domain ==="
          launchctl print gui/501 2>&1 | head -12
          echo "=== IOFramebuffer count ==="
          ioreg -rc IOFramebuffer 2>/dev/null | grep -c IOFramebuffer
          echo "=== console user ==="
          stat -f%Su /dev/console
          echo "=== WindowServer job ==="
          launchctl print system/com.apple.WindowServer 2>&1 | head -15
          echo "=== SkyLight present ==="
          ls -la /System/Library/PrivateFrameworks/SkyLight.framework 2>&1 | head -3
