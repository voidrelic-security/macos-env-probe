name: gui-check
on:
  workflow_dispatch:
jobs:
  chk:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: probe GUI session
        run: |
          set +e
          echo "=== WindowServer / loginwindow ==="
          pgrep -lf WindowServer
          pgrep -lf loginwindow
          echo "=== gui domain ==="
          launchctl print gui/501 2>&1 | head -12
          echo "=== 是否有显示设备 ==="
          ioreg -rc IOFramebuffer 2>/dev/null | grep -c IOFramebuffer
          echo "=== 当前 console user ==="
          stat -f%Su /dev/console
          echo "=== WindowServer 的 mach service ==="
          launchctl print system/com.apple.WindowServer 2>&1 | head -20
          echo "=== 是否有 Aqua session ==="
          /usr/bin/python3 -c "
import subprocess
r=subprocess.run(['launchctl','print','gui/501'],capture_output=True,text=True)
print('gui/501 rc=',r.returncode)
print([l for l in r.stdout.splitlines() if 'WindowServer' in l][:5])
"
