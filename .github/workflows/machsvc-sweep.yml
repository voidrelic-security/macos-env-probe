name: machsvc-sweep
on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: build probe
        run: |
          set -x
          mkdir -p /tmp/ms
          cat > /tmp/ms/probe.c <<'CEOF'
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include <servers/bootstrap.h>

          int main(int argc, char **argv) {
            if (argc < 2) { printf("usage: probe <service>\n"); return 2; }
            mach_port_t bp = MACH_PORT_NULL;
            kern_return_t kr = task_get_bootstrap_port(mach_task_self(), &bp);
            if (kr != KERN_SUCCESS) { printf("RESULT %s bootstrap_port_error %d\n", argv[1], kr); return 0; }
            mach_port_t sp = MACH_PORT_NULL;
            kr = bootstrap_look_up(bp, argv[1], &sp);
            if (kr != KERN_SUCCESS) {
              printf("RESULT %s LOOKUP_FAIL %d\n", argv[1], kr);
              return 0;
            }
            printf("RESULT %s LOOKUP_OK port=%u\n", argv[1], sp);

            /* 发一条最小 Mach 消息，看服务是否回错误/回复/直接断 */
            struct { mach_msg_header_t h; char body[64]; } msg;
            memset(&msg, 0, sizeof msg);
            msg.h.msgh_bits = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0) | MACH_MSGH_BITS_COMPLEX;
            msg.h.msgh_size = sizeof(mach_msg_header_t);
            msg.h.msgh_remote_port = sp;
            msg.h.msgh_local_port = MACH_PORT_NULL;
            msg.h.msgh_id = 0;
            mach_msg_return_t mr = mach_msg(&msg.h, MACH_SEND_MSG | MACH_SEND_TIMEOUT,
                                            msg.h.msgh_size, 0, MACH_PORT_NULL, 500, MACH_PORT_NULL);
            printf("RESULT %s SEND mr=%d\n", argv[1], mr);
            mach_port_deallocate(mach_task_self(), sp);
            return 0;
          }
          CEOF
          clang -O0 -o /tmp/ms/probe /tmp/ms/probe.c && echo BUILD_OK

      - name: collect mach service names from LaunchDaemons
        run: |
          set +e
          python3 - <<'PY'
          import plistlib, glob, os, json
          names = {}
          for p in glob.glob('/System/Library/LaunchDaemons/*.plist'):
              try:
                  with open(p,'rb') as f: d = plistlib.load(f)
              except Exception: continue
              ms = d.get('MachServices') or {}
              if isinstance(ms, dict): keys = list(ms.keys())
              elif isinstance(ms, list): keys = ms
              else: keys = []
              prog = d.get('Program') or (d.get('ProgramArguments') or ['?'])[0]
              for k in keys:
                  names[k] = {'plist': os.path.basename(p), 'program': prog}
          json.dump(names, open('/tmp/ms/services.json','w'))
          print('services found:', len(names))
          for k in list(names)[:15]: print('  ', k, '->', names[k]['program'])
          PY

      - name: sweep reachability as uid 501
        run: |
          set +e
          echo "whoami: $(id)"
          python3 - <<'PY'
          import json, subprocess
          svcs = json.load(open('/tmp/ms/services.json'))
          ok, fail = [], []
          for name in sorted(svcs):
              r = subprocess.run(['/tmp/ms/probe', name], capture_output=True, timeout=10)
              out = r.stdout.decode('utf-8','replace').strip().splitlines()
              res = [l for l in out if l.startswith('RESULT')]
              joined = ' ; '.join(res)
              if 'LOOKUP_OK' in joined:
                  ok.append((name, svcs[name]['program'], joined))
              else:
                  fail.append(name)
          print('=== REACHABLE (bootstrap_look_up 成功) : %d ===' % len(ok))
          for name, prog, j in ok:
              print('  %-58s %-50s %s' % (name, prog[:50], j[-60:]))
          print()
          print('=== NOT REACHABLE : %d ===' % len(fail))
          print('  ' + ', '.join(fail[:40]))
          json.dump(ok, open('/tmp/ms/reachable.json','w'))
          PY

      - name: cross-check who runs as root
        if: always()
        run: |
          set +e
          python3 - <<'PY'
          import json, subprocess
          try: ok = json.load(open('/tmp/ms/reachable.json'))
          except Exception: ok = []
          print('=== 可达服务里 Program 为 root 可执行 / 无 UserName 的 ===')
          for name, prog, j in ok:
              print('  %-58s %s' % (name, prog))
          print()
          print('=== launchctl 里这些服务的状态（抽样前 20）===')
          for name, prog, j in ok[:20]:
              r = subprocess.run(['launchctl','print','system/'+name], capture_output=True, timeout=10)
              first = [l.strip() for l in r.stdout.decode('utf-8','replace').splitlines() if l.strip()][:2]
              print('  %-50s rc=%d %s' % (name[:50], r.returncode, ' | '.join(first)[:110]))
          PY

      - name: report
        if: always()
        run: echo done
