name: dmg-fuzz3
on:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - name: build valid dmg
        run: |
          set -x
          mkdir -p /tmp/d && cd /tmp/d
          hdiutil create -size 2m -fs HFS+ -volname T -ov /tmp/d/raw.dmg >/dev/null
          hdiutil convert /tmp/d/raw.dmg -format UDZO -o /tmp/d/valid.dmg >/dev/null
          ls -la /tmp/d/valid.dmg
          hdiutil imageinfo /tmp/d/valid.dmg >/dev/null && echo "baseline imageinfo OK"

      - name: calibration
        run: |
          set +e
          python3 - <<'PY'
          import struct, zlib, subprocess, os
          d = open('/tmp/d/valid.dmg','rb').read()
          n = len(d)
          # 向后搜 koly
          p = d.rfind(b'koly', max(0, n-4096))
          print('file size =', n, ' koly at', p, ' (n-p =', n-p, ')')
          if p < 0:
              print('NO KOLY'); raise SystemExit
          tr = d[p:p+512]
          xml_off, xml_len = struct.unpack_from('<QQ', tr, 0xD8)
          print('xmlOffset =', xml_off, ' xmlLength =', xml_len)
          print('xml_off+xml_len =', xml_off+xml_len, ' vs trailer start =', p)
          print('SELF-CONSISTENT:', xml_off + xml_len == p)
          print('dataForkLength =', struct.unpack_from('<Q', tr, 0x20)[0])
          print('segmentCount   =', struct.unpack_from('<I', tr, 0x3C)[0])
          print('dataCkType/Size=', struct.unpack_from('<II', tr, 0x50))
          print('sectorCount@1EC=', struct.unpack_from('<Q', tr, 0x1EC)[0])
          print('imageVariant@1E8=', struct.unpack_from('<I', tr, 0x1E8)[0])
          # 尾部 64 字节
          print('trailer tail:', tr[-64:].hex())

          # --- 校验门测试：改 trailer 关键字段，看 imageinfo 是否报错 ---
          def run(blob, tag):
              open('/tmp/d/t.dmg','wb').write(blob)
              r = subprocess.run(['hdiutil','imageinfo','/tmp/d/t.dmg'],
                                 capture_output=True, timeout=8)
              out = (r.stdout+r.stderr).decode('utf-8','replace')
              first = [l for l in out.splitlines() if l.strip()][:2]
              print('  [%s] rc=%d  %s' % (tag, r.returncode, ' | '.join(first)[:150]))
              return r.returncode

          print('--- 校验门测试 ---')
          run(d, 'unmodified')
          for off, tag in [(0x20,'dataForkLength'), (0xD8,'xmlOffset'), (0xE0,'xmlLength'),
                           (0x1EC,'sectorCount'), (0x3C,'segmentCount'), (0x50,'dataCkType')]:
              b = bytearray(d); b[p+off] ^= 0xFF
              run(bytes(b), 'flip '+tag)

          # --- 暴力找 trailer 自校验（全偏移 x 全范围） ---
          print('--- 暴力定位自校验 ---')
          hits = []
          for ck in range(0, 512-3, 4):
              stored = struct.unpack_from('<I', tr, ck)[0]
              if stored == 0: continue
              for cover in (ck, 0x1F8, 0x200, 512):
                  if cover < ck: continue
                  for span in (4, 8, 0x80, 0x88, 0x100):
                      blob = bytearray(tr)
                      for i in range(ck, min(ck+span, 512)): blob[i] = 0
                      if (zlib.crc32(bytes(blob[:cover])) & 0xffffffff) == stored:
                          hits.append((ck, cover, span, stored))
          print('self-checksum hits:', hits[:10], 'count=', len(hits))
          PY

      - name: structured fuzz
        run: |
          set +e
          python3 - <<'PY'
          import struct, subprocess, random, shutil, os
          d = open('/tmp/d/valid.dmg','rb').read()
          n = len(d)
          p = d.rfind(b'koly', max(0, n-4096))
          tr = d[p:p+512]
          xml_off, xml_len = struct.unpack_from('<QQ', tr, 0xD8)
          ok = (xml_off + xml_len == p) and 0 < xml_len < p
          print('layout ok =', ok, 'xml[%d,%d)' % (xml_off, xml_off+xml_len))
          if not ok:
              print('LAYOUT BAD -- aborting'); raise SystemExit

          random.seed(0xBADF00D)
          rounds = 140
          crashes, hangs, rcs = [], 0, {}
          for i in range(rounds):
              b = bytearray(d)
              m = random.random()
              if m < 0.45:
                  # XML / blkx 区（真正的解析器输入）
                  for _ in range(random.choice([1,2,4,8])):
                      off = xml_off + random.randrange(0, xml_len)
                      b[off] = random.randrange(0,256)
              elif m < 0.75:
                  # trailer 结构字段
                  for _ in range(random.choice([1,2])):
                      off = random.randrange(0, 0x1F8, 4)
                      struct.pack_into('<I', b, p+off, random.randrange(0,1<<32))
              else:
                  # data fork
                  dflen = struct.unpack_from('<Q', tr, 0x20)[0]
                  for _ in range(random.choice([1,4,16])):
                      off = random.randrange(0, max(1, min(dflen, p)))
                      b[off] = random.randrange(0,256)
              if random.random() < 0.08:
                  b = b[:random.randrange(max(1,p//2), n)]
              open('/tmp/d/mut.dmg','wb').write(bytes(b))
              try:
                  r = subprocess.run(['hdiutil','imageinfo','/tmp/d/mut.dmg'],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                     timeout=4)
                  rc = r.returncode
              except subprocess.TimeoutExpired:
                  rc = -999; hangs += 1
              rcs[rc] = rcs.get(rc,0)+1
              if rc < 0 or rc >= 128:
                  crashes.append((i, rc, len(b)))
                  shutil.copy('/tmp/d/mut.dmg', '/tmp/d/crash_%d_rc%d.dmg' % (i,rc))
                  print('!!! CRASH round=%d rc=%d' % (i,rc), flush=True)
              if i % 20 == 0: print('  progress', i, 'crashes', len(crashes), 'hangs', hangs, flush=True)
          print('rounds=%d crashes=%d hangs=%d rc-histogram=%s' % (rounds, len(crashes), hangs, rcs))
          if crashes: print('CRASH LIST:', crashes[:20])
          PY

      - name: triage
        if: always()
        run: |
          set +e
          ls -la /tmp/d/crash_*.dmg 2>/dev/null
          ls -lat ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -8

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmg-crashes3
          path: /tmp/d/crash_*.dmg
          if-no-files-found: ignore
          retention-days: 3
